# Servidor DHCP en VLAN 1000 (eth1) para asignacion dinamica a los Pods del Deployment web (Multus)
# Desactiva DNS (port=0) y no anuncia default gateway (dhcp-option=3 vacio) para no alterar
# la ruta por defecto ni el DNS (CoreDNS) configurados por Calico en eth0 de los Pods.

port=0
interface=eth1
bind-interfaces
dhcp-authoritative
dhcp-range=10.1.2.50,10.1.2.95,255.255.255.0,12h
dhcp-option=3
dhcp-option=6
log-dhcp
