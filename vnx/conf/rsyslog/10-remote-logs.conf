# Configuracion de rsyslog centralizado en el contenedor LXC 'logs' (10.1.2.101)
# Habilita recepcion de logs remotos por UDP y TCP en el puerto 514 sobre la VLAN 1000

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# Plantilla para organizar los logs entrantes por maquina origen y programa
$template RemoteLogs,"/var/log/remotos/%FROMHOST-IP%/%PROGRAMNAME%.log"
*.* ?RemoteLogs
& stop
